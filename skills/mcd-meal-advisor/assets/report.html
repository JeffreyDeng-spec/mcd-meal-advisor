<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>麦麦点餐参谋 · 本轮餐单</title>
<style>
:root{--bg:#f6f3ec;--paper:#fffefb;--ink:#242a25;--muted:#697168;--line:#dcded2;--accent:#f3ce54;--green:#325b42}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}main{max-width:1180px;margin:auto;padding:40px 30px 64px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding-bottom:26px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--green)}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-1px;margin:10px 0}h2{font-size:23px;letter-spacing:-.4px;margin:0}h3{font-size:18px;margin:14px 0 10px}.muted,small{color:var(--muted)}small{display:block;font-size:12px}.source{font-size:12px;border:1px solid var(--line);border-radius:40px;padding:8px 14px;max-width:300px}.brief{display:grid;grid-template-columns:1fr 340px;gap:36px;padding:28px 0}#store{font-weight:650;margin:0}#address{font-size:13px;margin:4px 0 16px}#request{margin:0}form{background:#e9ecdf;padding:18px;border-radius:16px}label{display:block;font-size:13px;font-weight:650}.budget-row{display:flex;gap:8px;margin:10px 0}input{width:100%;min-width:0;font:inherit;font-size:20px;background:var(--paper);border:1px solid #adb69f;padding:8px 12px;border-radius:8px}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--paper);font-size:13px;font-weight:650}button:hover{border-color:var(--green)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #39694b;outline-offset:3px}.primary{background:var(--accent);border-color:var(--accent)}#budget-error{color:#9e362e;font-size:13px}#original-budget{font-size:11px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.pill{font-size:11px;padding:4px 9px;border-radius:30px;background:#edf0e5;color:var(--green);display:inline-block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:20px 0 28px}.meal-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;min-width:0}.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.number{font-size:12px;color:var(--muted)}.plate{height:96px;display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 0;background:radial-gradient(ellipse at center,#fffefb 32%,#e9ecd9 33%,#e9ecd9 47%,transparent 48%);color:var(--green)}.plate-number{font-size:32px;font-weight:600}.plate-label{font-size:12px}.meal-card h3{font-size:19px;overflow-wrap:anywhere}.meal-card ul{font-size:13px;color:var(--muted);padding-left:18px;margin:0 0 20px}.price{display:flex;gap:8px;align-items:baseline;margin-top:auto}.price strong{font-size:35px;letter-spacing:-1px}.price span{font-size:11px;color:var(--muted)}.remaining{font-size:13px;color:var(--green);margin:0}.comparison{font-size:12px;font-weight:650}.meal-card p.muted{font-size:12px;margin:4px 0}.meal-card button{margin-top:18px;width:100%}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:20px}.selects{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}select{width:100%;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:12px}.coupon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:12px}.coupon{padding:18px;background:#f5f5ef;border-radius:12px;overflow-wrap:anywhere}.coupon h3{font-size:15px;margin:0 0 8px}.coupon p{font-size:13px;margin:8px 0}.notice{font-size:13px}#history{font-size:12px;color:var(--muted)}#run{font-size:11px;overflow-wrap:anywhere}footer{border-top:1px solid var(--line);margin-top:28px;padding-top:20px;font-size:12px;color:var(--muted)}.footer-row{display:flex;gap:20px;justify-content:space-between;align-items:center}#copy-status{font-size:13px;color:var(--green)}textarea{display:block;width:100%;min-height:130px;margin-top:18px;padding:15px;font:inherit;border:1px solid var(--green)}[hidden]{display:none!important}#diff p{font-size:13px}#status{font-size:14px;color:var(--muted)}
@media(max-width:850px){.brief{grid-template-columns:1fr 280px;gap:20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}.source{margin-top:16px;display:inline-block}}@media(max-width:600px){main{padding:24px 16px 40px}.brief,.cards,.coupon-grid,.selects{grid-template-columns:1fr}.brief{gap:18px}.cards{gap:14px}.meal-card{padding:20px}.plate{height:72px}.panel{padding:20px}.footer-row{display:block}.footer-row button{margin-top:12px}h1{font-size:32px}}@media print{body{background:white}main{padding:0}.cards{grid-template-columns:repeat(3,1fr)}button,form,.selects{display:none}.meal-card,.coupon{break-inside:avoid}}
</style></head><body><main>
<header><div><div class="eyebrow">MEAL ADVISOR / 本轮餐单</div><h1>今天这餐，选得明白。</h1><p class="muted">预算、口味、优惠，放在一起比较。</p></div><div id="source" class="source"></div></header>
<section class="brief" aria-label="本次需求"><div><p id="store"></p><p id="address" class="muted"></p><p id="request"></p></div><form id="budget-form"><label for="budget">调整本轮筛选预算</label><div class="budget-row"><input id="budget" type="text" inputmode="decimal" aria-describedby="original-budget budget-error"><button type="submit">筛选</button></div><div id="original-budget" class="muted"></div><div id="budget-error" role="alert"></div></form></section>
<section aria-labelledby="options-title"><div class="section-head"><h2 id="options-title">你的餐单选择</h2><span id="count" class="pill"></span></div><p id="status" role="status"></p><div id="cards" class="cards"></div><p class="notice">当前筛选预算 <strong id="budget-value"></strong>。最多展示三种不同餐单；“最低实付”仅指本轮已核价候选。</p></section>
<section id="compare" class="panel" aria-labelledby="compare-title"><h2 id="compare-title">多花的钱，换来了什么？</h2><div class="selects"><label>从这一份<select id="compare-a"></select></label><label>换成这一份<select id="compare-b"></select></label></div><div id="diff"></div></section>
<section class="panel" aria-labelledby="audit-title"><div class="section-head"><h2 id="audit-title">顺手看看，你的券</h2><span class="pill">不为用券而超预算</span></div><p class="muted notice">账户持有不等于本店、本餐单适用。净节省只来自同内容的官方报价对照。</p><div id="audit-list" class="coupon-grid"></div></section>
<section id="history" class="panel" aria-label="历史报价"></section>
<footer><div class="footer-row"><div><p>报价展示有效期为核价后 15 分钟，这是本项目的展示策略。更改餐品后需要重新核价。</p><p>报告在本机运行，不实时联网、不下单、不领券。公开分享前请自行检查门店和偏好等信息。</p></div><button id="renew" type="button">复制重新查询请求</button></div><p id="copy-status" role="status" aria-live="polite"></p><p id="run"></p><p>麦麦点餐参谋 · 独立参赛作品，非麦当劳官方产品。</p></footer>
</main><script id="report-data" type="application/json">__REPORT_DATA__</script><script>__REPORT_JS__</script></body></html>
